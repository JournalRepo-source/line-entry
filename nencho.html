<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>年末調整</title>
<link rel="stylesheet" href="entry.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
</head><body>
<div id="msg">読み込んでいます…</div>
<iframe id="gas" name="gas" title="年末調整の申告フォーム"></iframe>
<script>
  // 年末調整（P10 年調フォーム）。LIFF「年末調整」の行き先。?p=reg（LINE のご登録）だけ窓へ渡す
  // ?p= のページごとに題名を変える＝LINE の画面の上に出る名前（LIFF がほどく前の liff.state=%3Fp%3Dnyutai の形も見る）
  // 題名はリッチメニューのボタン名と同じ（2026-11-21 下宮さん）。GAS のフォーム.gs（iPhone はそちらの題名が出る）と同じ言葉に。ボタン名を変えたら両方を直す
  // nyutai＝入退社するとき・henko＝扶養・住所など情報の変更・reg＝あいさつの「登録はこちら」から開く登録ページ
  try {
    var PAGE_TITLES = { nyutai: "入退社するとき", henko: "扶養・住所など情報の変更", reg: "LINE のご登録" };
    var pm = decodeURIComponent(location.search).match(/[?&]p=([a-z]+)(&|$)/);
    // 表に無い p（この先足すページで表に足し忘れたとき）は「年末調整」と出さず事務所の名前にする。p が無いときだけ年末調整
    var pt = pm ? (PAGE_TITLES[pm[1]] || "サン&Journal事務所") : "";
    if (pt) { document.title = pt; document.getElementById("gas").title = pt; }
  } catch (e) {}
  window.ENTRY = {
    liffId: "2012382315-21IMiklG",
    gasUrl: "https://script.google.com/macros/s/AKfycbweNyHcqvMqyY8We2iuNZtk3pig4o9-u_lRNPeQz3oPjkYtPmfn1MJo9ERBYj_MSpAZwA/exec",
    pass: ["p"]
  };
</script>
<script src="entry.js"></script>
</body></html>
