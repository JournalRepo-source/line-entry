<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>入社のご連絡</title>
<link rel="stylesheet" href="entry.css">
</head><body>
<div id="msg">読み込んでいます…</div>
<iframe id="gas" name="gas" title="入社のご連絡のフォーム"></iframe>
<script>
  // 入社される本人のリンク（LINE なし）。鍵 t を GAS の doPost へ POST で渡し、窓（iframe）に画面を出す＝GAS の帯が出ない。
  // ※ この倉庫は公開。鍵・個人データをここに書かない（鍵はリンクの URL から受け取って窓へ渡すだけ）。
  (function () {
    var gasUrl = "https://script.google.com/macros/s/AKfycbweNyHcqvMqyY8We2iuNZtk3pig4o9-u_lRNPeQz3oPjkYtPmfn1MJo9ERBYj_MSpAZwA/exec";
    var msg = document.getElementById("msg");
    var t = new URLSearchParams(location.search).get("t") || "";
    if (!/^[0-9a-f]{32}$/.test(t)) { msg.textContent = "リンクが正しくありません。事務所からのリンクをもう一度お開きください。"; msg.className = "err"; return; }
    var f = document.createElement("form");
    f.method = "post"; f.action = gasUrl; f.target = "gas"; f.style.display = "none";
    [["p", "self"], ["t", t]].forEach(function (kv) {
      var i = document.createElement("input"); i.type = "hidden"; i.name = kv[0]; i.value = kv[1]; f.appendChild(i);
    });
    document.body.appendChild(f);
    document.getElementById("gas").addEventListener("load", function () { msg.hidden = true; }, { once: true });
    f.submit();
  })();
</script>
</body></html>
